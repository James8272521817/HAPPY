<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hearts"></div>

<div class="container">

    <div id="envelope-section">
        <h1>💌 A Letter For You 💌</h1>
        <p>Click the envelope, my love ❤️</p>

        <div class="envelope" onclick="openLetter()">
            ✉️
        </div>
    </div>

    <div id="letter-section" class="hidden">
        <div class="letter">

            <h1>🎂 Happy Birthday 🎂</h1>

            <p id="typed-text"></p>

        </div>

        <div class="music-section">
            <h2>🎵 A Song For You My Love 🎵</h2>

            <iframe
                width="100%"
                height="315"
                src="https://www.youtube.com/embed/BzWo-VxJU5I"
                title="YouTube video player"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
